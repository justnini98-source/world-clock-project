<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.3/moment-timezone-with-data-1970-2030.min.js"></script>
</head>
    <title>World Clock</title>
</head>
<body>
  <div class="container">
        <h1>World Clock</h1>
        <select name="city" id="city">
            <option value="">Select a city</option>
            <option value="current">My location</option>
            <option value="Europe/London">London</option>
            <option value="Europe/Paris">Paris</option>
            <option value="Asia/Tokyo">Tokyo</option>
            <option value="Asia/Singapore">Singapore</option>
            <option value="America/Los_Angeles">Los Angeles</option>
        </select>

    <div id="cities">
        <div class="city" id="new-york">
            <div>
                <h2>New York City 🇺🇸</h2>
                <div class="date"></div>
            </div>
                <div class="time"></div>
        </div> 
        <div class="city" id="buenos-aires">
            <div>
                <h2>Buenos Aires 🇦🇷</h2>
                <div class="date"></div>
            </div>
                <div class="time"></div>
        </div>
        <div class="city" id="auckland">
            <div>
                <h2>Auckland 🇳🇿</h2>
                <div class="date"></div>
            </div>
                <div class="time"></div>
          </div>
    </div>
   </div>
    <footer>This project has been coded with 🖤 by <a href="https://github.com/justnini98-source" target="_blank">Vanessa</a> and is open-sourced on <a href="https://github.com/justnini98-source/world-clock-project" target="_blank"> Github</a>.</footer>
<script src="src/index.js"></script>  
</body>
</html>
