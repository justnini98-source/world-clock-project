<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
</head>
    <title>World Clock</title>
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <select name="dropdown" id="">
            <option value="">Select a city</option>
            <option value="">London</option>
            <option value="">Paris</option>
            <option value="">Brussels</option>
        </select>

    <div class="city">
        <div>
            <h2>New York City 🇺🇸</h2>
            <div class="date">August 22nd, 2026</div>
        </div>
        <div class="time">11:40 <small>am</small></div>
    </div>
    <div class="city">
        <div>
            <h2>Buenos Aires 🇦🇷</h2>
            <div class="date">August 22nd, 2026</div>
        </div>
        <div class="time">11:40 <small>am</small></div>
    </div>
    <div class="city">
        <div>
            <h2>Auckland 🇳🇿</h2>
            <div class="date">August 22nd, 2026</div>
        </div>
        <div class="time">11:40 <small>am</small></div>
    </div>

    </div>

</html>
